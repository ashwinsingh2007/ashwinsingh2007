<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset=".2" stop-color="#6366f1"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset=".8" stop-color="#f4aa1c"/>
      <stop offset="1" stop-color="#f4aa1c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .s { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)" opacity=".7"/>
  <rect class="s" x="0" y="10" width="200" height="4" rx="2" fill="url(#shine)"/>
  <circle cx="600" cy="12" r="4" fill="#0b1020" stroke="#22d3ee" stroke-width="2"/>
</svg>
